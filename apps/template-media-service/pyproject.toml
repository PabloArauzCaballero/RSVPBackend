[project]
name = "rsvp-template-media-service"
version = "1.0.0"
requires-python = ">=3.12"
# Pinned in requirements.txt; ranges here document compatibility.
dependencies = [
  "Django>=5.2,<6",
  "djangorestframework>=3.16,<4",
  "Pillow>=11,<13",
  "boto3>=1.35,<2",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.9,<3",
  "pika>=1.3,<2",
]

[tool.django]
settings = "rsvp_template_media.settings"
