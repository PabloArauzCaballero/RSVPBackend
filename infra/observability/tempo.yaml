server:
  http_listen_port: 3200
  grpc_listen_port: 4317
distributor:
  receivers:
    otlp:
      protocols:
        grpc: {}
        http: {}
ingester:
  max_block_duration: 5m
compactor:
  compaction:
    block_retention: 48h
storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

