name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  quality:
    name: Affected workspace quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: corepack enable
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: yarn}
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - run: pip install -r apps/template-media-service/requirements.txt
      - run: yarn install --immutable
      - run: yarn harness:validate
      - run: yarn contracts:validate
      - run: yarn turbo run build lint test --affected

  runtimes:
    name: Runtime ${{ matrix.runtime }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, java, python]
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: yarn}
      - uses: actions/setup-java@v4
        if: matrix.runtime == 'java'
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-python@v5
        if: matrix.runtime == 'python'
        with: {python-version: '3.14'}
      - run: pip install -r apps/template-media-service/requirements.txt
        if: matrix.runtime == 'python'
      - run: yarn install --immutable
      - run: yarn workspace @rsvp/identity-service test
        if: matrix.runtime == 'java'
      - run: yarn turbo run test --filter='@rsvp/*' --filter='!@rsvp/template-media-service' --filter='!@rsvp/identity-service'
        if: matrix.runtime == 'node'
      - run: yarn turbo run test --filter='@rsvp/template-media-service'
        if: matrix.runtime == 'python'

  integration:
    name: Integration (Postgres, RabbitMQ, MinIO)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: yarn}
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - run: pip install -r apps/template-media-service/requirements.txt
      - run: cp .env.example .env
      - run: docker compose up -d --wait postgres rabbitmq minio && docker compose up minio-init
      - run: yarn install --immutable
      - run: yarn workspace @rsvp/celebration-site-service test:integration
      - run: yarn workspace @rsvp/template-media-service test:integration

  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

