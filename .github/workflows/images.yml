name: Build service images
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [identity-service, celebration-site-service, template-media-service, guest-rsvp-service, notification-service, gift-list-service, provider-catalog-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          # Every service image builds from the repo root so it can use the shared workspace packages.
          context: .
          file: ./apps/${{ matrix.service }}/Dockerfile
          push: false
          tags: rsvp/${{ matrix.service }}:${{ github.sha }}

